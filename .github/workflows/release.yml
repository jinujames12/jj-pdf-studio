name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test --workspace
      - run: npm run tauri build
      - name: Prepare artifacts
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist-release | Out-Null
          # Cargo workspace: build output is in the repo-root target/ folder.
          Copy-Item target/release/jj-pdf-studio.exe "dist-release/JJPDFStudio-$v-portable.exe"
          Copy-Item target/release/bundle/nsis/*.exe "dist-release/JJPDFStudio-$v-setup.exe"
          Get-FileHash dist-release/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File dist-release/SHA256SUMS.txt -Encoding ascii
      # (later) code signing step via SignPath goes here
      - uses: softprops/action-gh-release@v2
        with:
          draft: true # review notes, then publish
          generate_release_notes: true
          files: dist-release/*
