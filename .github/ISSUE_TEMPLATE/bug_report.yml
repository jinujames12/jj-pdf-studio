name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown on the About screen.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: 'Windows 11 23H2'
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which build?
      options:
        - Portable exe
        - Installer
        - Built from source
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: >-
        If the problem depends on a particular PDF or image, attach it here only if it is safe to
        share. Do not upload private or confidential documents.
