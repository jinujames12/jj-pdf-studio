[package]
name = "pdf-core"
description = "Pure-Rust PDF operations for JJ PDF Studio (no Tauri dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lopdf = "0.45"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Image decoding for Images to PDF. Only the formats SPEC 5.8 lists are enabled.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp"] }
